# Configuração do harness do front. É o único arquivo desta pasta que muda de projeto para projeto.
# É um trecho de bash lido pelos scripts (os mesmos do backend, com a resposta também no formato do Claude Code).

# Comando que prova que o front continua de pé, ao final de todo turno em que o agente alterou código:
# contrato em dia, typecheck, lint, arquitetura (UI-001 a UI-006) e testes de unidade. Leva segundos.
# Os e2e no navegador (mais lentos) ficam para o CI e para o "Antes de terminar" da skill.
VERIFICACAO="cd poc && npm run -s verificar"

# Tempo máximo da verificação, em segundos.
VERIFICACAO_TIMEOUT=300

# O que conta como código: regex (grep -E) sobre o caminho relativo a frontend/.
CODIGO='^poc/(src/|e2e/|contrato|scripts/|package\.json$|tsconfig\.json$|eslint\.config\.js$|vite\.config\.ts$|vitest\.config\.ts$|playwright\.config\.ts$|components\.json$)'

# Arquivos que o agente não pode alterar nem apagar depois de existirem no git. Criar é permitido.
# São as barreiras: afrouxá-las para o build passar é o que o harness existe para impedir.
PROTEGIDOS='
^\.github/hooks/
^\.github/skills/ui-jornada/scripts/verificar\.sh$
^poc/eslint\.config\.js$
^poc/tsconfig\.json$
^poc/e2e/apoio\.ts$
'

contexto_extra() {
    echo "Front: siga as skills ui-jornada (arquitetura) e react-jornada (receitas). Tela nova: primeiro o spec e2e, a partir da especificação."
    return 0
}
