name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = compilação + testes (surefire) + empacotamento + testes de integração (failsafe).
      # O runner do GitHub já tem Docker, então o Dev Services funciona nos testes.
      - name: Build
        run: ./mvnw -B verify
