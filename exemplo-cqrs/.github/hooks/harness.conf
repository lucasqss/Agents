# Configuração do harness. É o único arquivo desta pasta que muda de projeto para projeto.
# É um trecho de bash lido pelos três scripts.

# Comando que prova que o projeto continua de pé. Roda ao final de todo turno em que o agente
# alterou algum arquivo de CODIGO. Precisa ser rápido (segundos) e não depender de Docker;
# a verificação completa (./mvnw verify) fica para o CI.
VERIFICACAO="./mvnw -q test -Dtest=ArquiteturaTest,CatalogoDeRegrasTest -Dsurefire.failIfNoSpecifiedTests=false"

# Tempo máximo da verificação, em segundos (menor que o timeoutSec de agentStop em harness.json).
VERIFICACAO_TIMEOUT=600

# O que conta como código: regex (grep -E) sobre o caminho relativo à raiz do projeto.
CODIGO='^(src/|pom\.xml$)'

# Arquivos que o agente não pode alterar nem apagar depois de existirem no git. Criar é permitido.
# Um regex (grep -E) por linha, sobre o caminho relativo à raiz do projeto.
PROTEGIDOS='
^src/test/java/.*/arquitetura/
^src/main/resources/db/migration/V[0-9].*\.sql$
^\.github/hooks/
'

# Texto extra entregue ao agente no início da sessão (opcional). Uma linha por echo.
contexto_extra() {
    local tipo
    tipo=$(grep -rhs 'String NOME' src/test/java --include=Tipo.java | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)
    [ -n "$tipo" ] && echo "Tipo do componente: $tipo (skill arquiteto-padrao)."
    return 0
}
