# Aplicação do canal web. O que é comum (banco, Flyway, tesouraria) vem do núcleo:
# nucleo/src/main/resources/META-INF/microprofile-config.properties. Aqui fica só o que é do canal.
quarkus.application.name=consorcio-canal-web
# Em dev, uma porta por canal para subirem juntos; no container, 8080.
%dev.quarkus.http.port=8081
quarkus.http.test-port=8091

# OpenAPI em /q/openapi e Swagger UI em /q/swagger-ui (por padrão o Swagger UI só existe em dev e test).
mp.openapi.extensions.smallrye.info.title=Consórcio - canal web
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}

# Nos testes, um Service Stub da própria app responde pela tesouraria.
%test.quarkus.rest-client.tesouraria.url=http://localhost:${quarkus.http.test-port}/fake-tesouraria
