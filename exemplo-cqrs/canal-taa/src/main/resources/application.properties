# Aplicação do canal TAA. O que é comum (banco, Flyway, tesouraria) vem do núcleo:
# nucleo/src/main/resources/META-INF/microprofile-config.properties. Aqui fica só o que é do canal.
quarkus.application.name=consorcio-canal-taa
# Em dev, uma porta por canal para subirem juntos; no container, 8080.
%dev.quarkus.http.port=8083
quarkus.http.test-port=8093

mp.openapi.extensions.smallrye.info.title=Consórcio - canal TAA
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
