# Sobe o banco e uma aplicação por canal (antes: ./mvnw package -DskipTests).
# Em produção, cada canal tem a própria rota no API gateway: /web/ -> canal-web, /mobile/ -> canal-mobile...
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  canal-web:
    build:
      context: canal-web
      dockerfile: src/main/docker/Dockerfile.jvm
    environment: &banco
      DB_URL: jdbc:postgresql://postgres:5432/app
      DB_USER: app
      DB_PASSWORD: app
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  canal-mobile:
    build:
      context: canal-mobile
      dockerfile: src/main/docker/Dockerfile.jvm
    environment: *banco
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  canal-taa:
    build:
      context: canal-taa
      dockerfile: src/main/docker/Dockerfile.jvm
    environment: *banco
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
