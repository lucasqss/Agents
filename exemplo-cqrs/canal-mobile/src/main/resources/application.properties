# Aplicação do canal mobile. O que é comum (banco, Flyway, tesouraria) vem do núcleo:
# nucleo/src/main/resources/META-INF/microprofile-config.properties. Aqui fica só o que é do canal.
quarkus.application.name=consorcio-canal-mobile
# Em dev, uma porta por canal para subirem juntos; no container, 8080.
%dev.quarkus.http.port=8082
quarkus.http.test-port=8092

mp.openapi.extensions.smallrye.info.title=Consórcio - canal mobile
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
