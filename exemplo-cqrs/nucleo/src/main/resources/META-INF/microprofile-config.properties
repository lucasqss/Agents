# Configuração padrão do núcleo, herdada por todas as aplicações de canal.
# Cada canal pode sobrescrever no próprio application.properties (que tem prioridade maior).

quarkus.datasource.db-kind=postgresql

# Mensagens padrão (ex.: Bean Validation) em português.
quarkus.default-locale=pt-BR

# O schema vem só das migrations do Flyway (nucleo/src/main/resources/db/migration).
# Cada canal migra ao subir; o lock do Flyway serializa canais subindo ao mesmo tempo.
# Como os canais sobem em versões diferentes contra o MESMO banco, toda migration segue expand/contract.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Banco fora de dev/test (em dev e test o Dev Services sobe o PostgreSQL).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
%prod.quarkus.datasource.username=${DB_USER:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:app}

# Sistemas externos (Gateways em shared.gateway).
quarkus.rest-client.tesouraria.url=${TESOURARIA_URL:http://localhost:8089}
