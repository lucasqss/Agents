quarkus.datasource.db-kind=postgresql

# Mensagens padrão (ex.: Bean Validation) em português.
quarkus.default-locale=pt-BR

# O schema vem só das migrations do Flyway (src/main/resources/db/migration).
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# OpenAPI em /q/openapi. O build grava o documento em target/openapi; o openapi-diff (fase verify) o compara com
# docs/api/openapi-base.json e falha se a mudança quebra quem já consome a API.
mp.openapi.extensions.smallrye.info.title=${quarkus.application.name}
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# Banco fora de dev/test (em dev e test o Dev Services sobe o PostgreSQL; na aceitação, o BancoDaAceitacao).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
%prod.quarkus.datasource.username=${DB_USER:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:app}

# Alçada de aprovação (R4): valor até este valor, inclusive, vai a Aprovado ao concluir a análise (serviço) ou a vistoria
# (imobiliário); acima, a Aguardando alçada. O caso de uso lê e entrega ao domínio como Dinheiro.
processo.alcada=50000.00

# Protótipo de telas (prototipo-telas/, fora do jar): só em dev, a página servida em localhost:5173 pode chamar a API.
# Fora de dev nada disso vale; produção não aceita chamadas de outra origem.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
