# Cenários de aceitação do processo de pagamento. Um item por cenário; os passos rodam em ordem.
#   acao: abrir      -> dados (corpo do POST /processos) e espera { status, id?, estado? }
#   acao: executar   -> processo (ID da massa, em db/massa/R__massa_aceitacao.sql) ou o aberto no cenário,
#                       comando (a ação do processo), usuario, motivo, e espera { status, estado, mensagem?, acoes?, historico? }
# IDs: a massa vai de 2 a 999 (o 1 é a sentinela, que nenhum cenário usa), cada processo usado por um cenário só; o que
# os cenários abrem ganha 1000, 1001... na ordem
# deste arquivo. Só confira o ID gerado (espera.id) quando ele for o ponto do cenário: inserir um cenário que abre
# processo antes dele muda o número.

padroes:
  servico: &servico
    tipo: SERVICO
    numeroCota: COTA-100
    valor: 30000.00

cenarios:
  - cenario: '1.1'
    regra: R1
    descricao: Processo aberto ganha o primeiro ID livre depois da massa e começa em Aberto
    tipo: positivo
    passos:
      - acao: abrir
        dados: *servico
        espera: { status: 201, id: 1000, estado: ABERTO, acoes: [CANCELAR, INICIAR_ANALISE] }

  - cenario: '1.2'
    regra: R1
    descricao: Processo sem valor positivo não é aberto
    tipo: negativo
    passos:
      - acao: abrir
        dados: { <<: *servico, valor: 0 }
        espera: { status: 400 }

  - cenario: '2.1'
    regra: R2
    descricao: Serviço vai de Aberto a Pago pelo caminho comum
    tipo: positivo
    passos:
      - acao: abrir
        dados: { <<: *servico, numeroCota: COTA-101 }
        espera: { status: 201, id: 1001 }
      - { acao: executar, comando: INICIAR_ANALISE, espera: { status: 200, estado: EM_ANALISE } }
      - { acao: executar, comando: CONCLUIR_ANALISE, espera: { status: 200, estado: APROVADO } }
      - acao: executar
        comando: PAGAR
        usuario: tesouraria
        espera:
          status: 200
          estado: PAGO
          acoes: []
          historico: { quantidade: 3, ultima: { de: APROVADO, para: PAGO, acao: PAGAR, autor: tesouraria } }

  - cenario: '2.2'
    regra: R2
    descricao: Processo aberto não pode ser pago sem passar pela análise
    tipo: negativo
    passos:
      - acao: executar
        processo: 11
        comando: PAGAR
        espera: { status: 409, estado: ABERTO, mensagem: Não é possível pagar um processo no estado ABERTO }

  - cenario: '3.1'
    regra: R3
    descricao: Imobiliário dentro da alçada é aprovado ao concluir a vistoria
    tipo: positivo
    passos:
      - { acao: executar, processo: 3, comando: CONCLUIR_VISTORIA, usuario: vitor, espera: { status: 200, estado: APROVADO } }

  - cenario: '3.2'
    regra: R3
    descricao: Serviço não tem vistoria
    tipo: negativo
    passos:
      - acao: executar
        processo: 10
        comando: CONCLUIR_VISTORIA
        espera: { status: 409, estado: EM_ANALISE }

  - cenario: '4.1'
    regra: R4
    descricao: Valor igual à alçada é aprovado direto
    tipo: positivo
    passos:
      - { acao: executar, processo: 5, comando: CONCLUIR_ANALISE, espera: { status: 200, estado: APROVADO } }

  - cenario: '4.2'
    regra: R4
    descricao: Valor um centavo acima da alçada aguarda a alçada
    tipo: positivo
    passos:
      - acao: executar
        processo: 6
        comando: CONCLUIR_ANALISE
        espera: { status: 200, estado: AGUARDANDO_ALCADA, acoes: [APROVAR_NA_ALCADA, CANCELAR, DEVOLVER_PARA_ANALISE, REPROVAR] }

  - cenario: '4.3'
    regra: R4
    descricao: Imobiliário acima da alçada aguarda a alçada depois da vistoria, e o aprovador libera para pagamento
    tipo: positivo
    passos:
      - { acao: executar, processo: 4, comando: CONCLUIR_VISTORIA, espera: { status: 200, estado: AGUARDANDO_ALCADA } }
      - { acao: executar, processo: 4, comando: APROVAR_NA_ALCADA, usuario: carla, espera: { status: 200, estado: APROVADO } }

  - cenario: '5.1'
    regra: R5
    descricao: Reprovar exige motivo, que fica no histórico
    tipo: negativo
    passos:
      - acao: executar
        processo: 2
        comando: REPROVAR
        espera: { status: 400, estado: EM_ANALISE, mensagem: Motivo é obrigatório para reprovar um processo }
      - acao: executar
        processo: 2
        comando: REPROVAR
        motivo: renda incompatível
        espera:
          status: 200
          estado: REPROVADO
          historico: { quantidade: 1, ultima: { acao: REPROVAR, autor: ana, observacao: renda incompatível } }

  - cenario: '6.1'
    regra: R6
    descricao: Processo pago não aceita nenhuma ação, nem cancelar
    tipo: negativo
    passos:
      - { acao: executar, processo: 7, comando: CANCELAR, motivo: desistência, espera: { status: 409, estado: PAGO, acoes: [] } }

  - cenario: '7.1'
    regra: R7
    descricao: Processo à espera de documento pode ser cancelado, com motivo
    tipo: positivo
    passos:
      - { acao: executar, processo: 8, comando: CANCELAR, motivo: cliente desistiu, espera: { status: 200, estado: CANCELADO, acoes: [] } }

  - cenario: '8.1'
    regra: R8
    descricao: O histórico guarda cada transição, com quem fez
    tipo: positivo
    passos:
      - { acao: executar, processo: 9, comando: APROVAR_NA_ALCADA, usuario: carla, espera: { status: 200, estado: APROVADO } }
      - acao: executar
        processo: 9
        comando: PAGAR
        usuario: tesouraria
        espera:
          status: 200
          estado: PAGO
          historico: { quantidade: 2, ultima: { de: APROVADO, para: PAGO, acao: PAGAR, autor: tesouraria } }
