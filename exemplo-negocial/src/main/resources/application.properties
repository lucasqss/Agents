quarkus.datasource.db-kind=postgresql

# Mensagens padrão (ex.: Bean Validation) em português.
quarkus.default-locale=pt-BR

# O schema vem só das migrations do Flyway (src/main/resources/db/migration).
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# OpenAPI em /q/openapi e Swagger UI em /q/swagger-ui (por padrão o Swagger UI só existe em dev e test).
mp.openapi.extensions.smallrye.info.title=${quarkus.application.name}
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}

# Banco fora de dev/test (em dev e test o Dev Services sobe o PostgreSQL).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
%prod.quarkus.datasource.username=${DB_USER:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:app}

# Sistemas externos (Gateways em gateway). Nos testes, um Service Stub da própria app responde.
quarkus.rest-client.tesouraria.url=${TESOURARIA_URL:http://localhost:8089}
%test.quarkus.rest-client.tesouraria.url=http://localhost:${quarkus.http.test-port:8081}/fake-tesouraria

# Rotina de pagamento (entrypoint/batch): de quanto em quanto tempo ela pede à tesouraria o pagamento dos processos em
# PAGAMENTO_SOLICITADO (R20). "off" desliga o agendamento. Nos testes de integração ela fica desligada: o caso de uso é
# chamado direto. Os testes de aceitação ligam 1s pelo TesourariaStubResource.
pagamento.rotina.intervalo=5m
%test.pagamento.rotina.intervalo=off

# Alçada de aprovação (R16): valor vigente até este valor, inclusive, vai a Aprovado ao concluir a análise (serviço) ou a
# vistoria (imobiliário); acima, a Aguardando alçada. O caso de uso lê e entrega ao domínio como Dinheiro.
processo.alcada=50000.00

# Identidade (fatia 7, ADR 003): o cliente chega com um token JWT (Authorization: Bearer ...) que a aplicação verifica.
# Em produção um provedor de identidade real emite os tokens; trocá-lo é só configuração, sem mudar código:
#   MP_JWT_VERIFY_ISSUER               emissor esperado no claim "iss" (o do provedor)
#   MP_JWT_VERIFY_PUBLICKEY_LOCATION   arquivo ou URL (PEM ou JWKS) com a chave pública do provedor (obrigatória em produção)
# Os claims usados são sub (usuário), groups (papéis: cliente, backoffice, aprovador, tesouraria) e clienteId.
mp.jwt.verify.issuer=${MP_JWT_VERIFY_ISSUER:https://exemplo-negocial}
%prod.mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION}
# Desenvolvimento local: chave pública de desenvolvimento no classpath; o par privado dela está em
# docs/dev/privada-desenvolvimento.pem e assina os tokens de scripts/token-dev.sh (só para desenvolvimento).
%dev.mp.jwt.verify.publickey.location=jwt/publica-desenvolvimento.pem
# Testes: a chave pública de TESTE (o par de teste fica em src/test/resources e não vale em lugar nenhum além dos testes).
%test.mp.jwt.verify.publickey.location=aceitacao/chaves/publica-teste.pem
