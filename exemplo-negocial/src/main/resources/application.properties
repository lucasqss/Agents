quarkus.datasource.db-kind=postgresql

# Mensagens padrão (ex.: Bean Validation) em português.
quarkus.default-locale=pt-BR

# O schema vem só das migrations do Flyway (src/main/resources/db/migration).
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# OpenAPI em /q/openapi e Swagger UI em /q/swagger-ui (por padrão o Swagger UI só existe em dev e test).
mp.openapi.extensions.smallrye.info.title=${quarkus.application.name}
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}

# Banco fora de dev/test (em dev e test o Dev Services sobe o PostgreSQL).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
%prod.quarkus.datasource.username=${DB_USER:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:app}

# Sistemas externos (Gateways em gateway). Nos testes, um Service Stub da própria app responde.
quarkus.rest-client.tesouraria.url=${TESOURARIA_URL:http://localhost:8089}
%test.quarkus.rest-client.tesouraria.url=http://localhost:${quarkus.http.test-port:8081}/fake-tesouraria

# Rotina de pagamento (entrypoint/batch): de quanto em quanto tempo ela pede à tesouraria o pagamento dos processos em
# PAGAMENTO_SOLICITADO (R20). "off" desliga o agendamento. Nos testes de integração ela fica desligada: o caso de uso é
# chamado direto. Os testes de aceitação ligam 1s pelo TesourariaStubResource.
pagamento.rotina.intervalo=5m
%test.pagamento.rotina.intervalo=off
