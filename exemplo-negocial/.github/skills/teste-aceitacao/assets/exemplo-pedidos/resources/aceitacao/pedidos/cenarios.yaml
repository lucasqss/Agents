# Valores-padrão de um pedido: cada passo de "criar" pode herdar e trocar só o que importa.
padroes:
  pedido: &pedido
    acao: criar
    cliente: ana
    valor: 10.00
    itens:
      - { produto: caneta, quantidade: 2 }

cenarios:
  - cenario: '1.1'
    regra: R1
    descricao: Pedido dentro do limite é aprovado
    tipo: positivo
    passos:
      - <<: *pedido
        valor: 1000.00          # igual ao limite
        espera: { status: 201, estado: APROVADO }

  - cenario: '1.2'
    regra: R1
    descricao: Pedido acima do limite é recusado
    tipo: negativo
    passos:
      - <<: *pedido
        valor: 1000.01
        espera: { status: 201, estado: RECUSADO }

  - cenario: '2.1'
    regra: R2
    descricao: Antifraude recusa o cliente
    tipo: negativo
    passos:
      - <<: *pedido
        cliente: bruno
        espera: { status: 201, estado: RECUSADO }

  - cenario: '3.1'
    regra: R3
    descricao: Pedido aprovado pode ser cancelado uma vez
    tipo: positivo
    passos:
      - <<: *pedido
        itens:
          - { produto: caderno, quantidade: 1 }
          - { produto: lápis, quantidade: 3 }
        espera: { status: 201, estado: APROVADO }
      - acao: cancelar
        espera: { status: 200, estado: CANCELADO }
      - acao: cancelar
        observacao: cancelar de novo não muda nada
        espera: { status: 409, estado: CANCELADO }
