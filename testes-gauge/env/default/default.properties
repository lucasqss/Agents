# Configuração do Gauge para todos os ambientes. A URL da API e a chave que assina os tokens vêm de variáveis de
# ambiente (API_URL, CHAVE_PRIVADA_JWT): o docker-compose.yaml as define; fora dele, exporte antes de rodar.

# Relatório HTML em reports/html-report/index.html, substituído a cada execução.
gauge_reports_dir = reports
overwrite_reports = true

# Uma execução por vez: os cenários criam os próprios dados, mas o smoke é curto e a ordem ajuda a ler o log.
enable_multithreading = false

# A JVM dos passos: o gRPC do Gauge carrega biblioteca nativa, e o Java 25 avisa se o acesso não for liberado.
gauge_jvm_args = --enable-native-access=ALL-UNNAMED
