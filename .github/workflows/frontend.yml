# CI do front (frontend/poc): as barreiras rápidas e os percursos no navegador, a cada mudança no front ou no contrato
# do serviço que ele usa. É a garantia final: o harness do agente (frontend/.github/hooks) só roda a parte rápida.
name: frontend

on:
  push:
    paths: ["frontend/**", "exemplo-testes/docs/api/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "exemplo-testes/docs/api/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/poc/package-lock.json
      - run: npm ci
      - name: Barreiras (contrato, typecheck, lint, arquitetura, unidade)
        run: npm run verificar
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Percursos das jornadas (modo simulado, com axe)
        run: npm run test:e2e
      - name: Relatório dos percursos que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/poc/test-results
          retention-days: 7
